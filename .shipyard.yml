    requires:
      compat-openssl11-2600hz:
        verison: 1.1.1t-2600hz.2.el9
        op: '=='
metapackage:
  -
    name: meta-kazoo-applications
    type: required
    branch: '5.4'
    package: kazoo-core
dependencies: null
